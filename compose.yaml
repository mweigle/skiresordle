services:
  skiresordle:
    build: .
    image: skiresordle:latest
    expose:
      - "3000"
    volumes:
      - skiresordle-data:/app/data
      # - "C:\\dev\\skiresordle\\data:/app/data" # for linking the local db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/skieresordle:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - skiresordle
    environment:
      DOMAIN: ${DOMAIN:-}
    command: ["/bin/sh", "/etc/nginx/skieresordle/entrypoint.sh"]
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    profiles: ["tls"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "$$DOMAIN" ] || [ -z "$$EMAIL" ]; then
          echo "Set DOMAIN and EMAIL in .env before starting the TLS profile." >&2
          exit 1
        fi
        if [ ! -s "/etc/letsencrypt/live/$$DOMAIN/fullchain.pem" ]; then
          certbot certonly --non-interactive --agree-tos --no-eff-email \
            --email "$$EMAIL" --webroot --webroot-path /var/www/certbot \
            --domain "$$DOMAIN"
        fi
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot
          sleep 12h
        done
    environment:
      DOMAIN: ${DOMAIN:-}
      EMAIL: ${EMAIL:-}
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  skiresordle-data:
  certbot-etc:
  certbot-webroot:

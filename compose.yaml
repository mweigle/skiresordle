services:
  skiresordle:
    build: .
    image: skiresordle:latest
    expose:
      - "3000"
    volumes:
      - skiresordle-data:/app/data
      # - "C:\\dev\\skiresordle\\data:/app/data" # for linking the local db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - skiresordle
    restart: unless-stopped

volumes:
  skiresordle-data:
